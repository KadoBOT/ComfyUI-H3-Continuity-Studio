site_name: H3 Continuity
site_description: A ComfyUI custom node pack for authoring and rendering multi-shot sequences with MiniMax H3, with continuity across cuts.
site_url: https://kadobot.github.io/ComfyUI-H3-Continuity-Studio/
repo_url: https://github.com/KadoBOT/ComfyUI-H3-Continuity-Studio
repo_name: KadoBOT/ComfyUI-H3-Continuity-Studio
edit_uri: edit/main/guide/
copyright: Original project code is MIT licensed. See the repository for third-party notices.

# The user guide lives in guide/. The docs/ folder is the repository's reference notes and is not published as a site.
docs_dir: guide
site_dir: .tmp/site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      zoomable: true
      draggable: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Install: getting-started/install.md
      - Your first sequence: getting-started/first-sequence.md
      - The Studio tour: getting-started/studio-tour.md
  - Build:
      - build/index.md
      - Timeline and clips: build/timeline.md
      - Writing prompts: build/prompts.md
      - References and pictures: build/references.md
      - First and last frames: build/frame-guides.md
      - Stills with P-H3-Image: build/p-h3-image-stills.md
      - Stills with MiniMax H3 Image: build/minimax-h3-image-stills.md
      - Videos in one clip: build/video-layers.md
      - Exact lengths and long edits: build/exact-lengths.md
      - Long clips with context windows: build/long-clips.md
  - Continuity:
      - continuity/index.md
      - Visual memory: continuity/visual-memory.md
      - Joins and bridges: continuity/joins-and-bridges.md
      - Takes: continuity/takes.md
      - The continuity check: continuity/check.md
      - Long continuing chains: continuity/long-chains.md
  - Story:
      - story/index.md
      - The H3 Story writer: story/writer.md
      - Templates: story/templates.md
      - Cast and the Story bible: story/cast.md
  - Sound and text:
      - Audio lanes: sound/audio.md
      - Dialogue cues: sound/dialogue.md
      - Timed text: sound/timed-text.md
  - Output:
      - Full video and projects: output/full-video-and-projects.md
      - Keep the first pass: output/first-pass-cache.md
  - Automation:
      - Timeline HTTP API: automation/api.md
      - MCP for AI agents: automation/mcp.md
  - Reference:
      - Nodes: reference/nodes.md
      - Troubleshooting and limits: reference/troubleshooting.md
